<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión · Portal Estudiantil</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#15274e',
            paper: '#f4f7fb',
            line: '#dbe3ef',
            steel: '#64748b',
            accent: '#1b396a',
            signal: '#15803d'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>
  <link href="../assets/css/app.css" rel="stylesheet">
</head>

<body
  class="bg-paper font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-ink/10">

  <main class="w-full flex-grow flex items-center justify-center px-6 py-12 sm:py-20">
    <div class="w-full max-w-[440px] mx-auto flex flex-col items-center">

      <!-- Logo y Encabezado -->
      <div class="flex flex-col items-center text-center mb-7">
        <div
          class="w-14 h-14 rounded-2xl bg-[#b48833]/20 border border-[#b48833]/40 text-[#fbbf24] flex items-center justify-center p-3 shadow-sm mb-4">
          <svg aria-hidden="true" class="w-full h-full" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2 1 7l11 5 9-4.09V17h2V7L12 2Zm0 13-7-3.18V17l7 3.18L19 17v-5.18L12 15Z" />
          </svg>
        </div>
        <span class="text-[11px] font-semibold tracking-[0.16em] text-steel uppercase mb-1">Tecnológico Nacional de
          México</span>
        <h1 class="text-2xl font-bold tracking-tight text-ink">Portal Estudiantil</h1>
        <p class="text-xs text-steel mt-1">Ingeniería Industrial · Sistema Escolar</p>
      </div>

      <!-- Tarjeta del Formulario -->
      <div class="w-full bg-white rounded-2xl border border-line shadow-sm p-7 sm:p-9">
        <form class="space-y-5" id="login-form">

          <div class="space-y-1.5">
            <div class="flex justify-between items-center text-xs">
              <label class="font-semibold text-ink" for="user-identifier">
                Correo institucional o Matrícula
              </label>
              <span class="text-steel text-[11px] font-mono">@tecnm.mx</span>
            </div>
            <div class="relative">
              <input
                class="w-full bg-paper border border-line rounded-xl px-3.5 py-3 text-sm text-ink placeholder:text-steel/60 transition focus:bg-white focus:border-accent focus:ring-accent"
                id="user-identifier" name="identifier" placeholder="nombre.apellido@tecnm.mx o matrícula" required=""
                type="text" />
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between items-center text-xs">
              <label class="font-semibold text-ink" for="user-password">
                Contraseña
              </label>
              <a class="text-steel hover:text-accent transition-colors text-[11px]" href="#recuperar">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
            <div class="relative">
              <input
                class="w-full bg-paper border border-line rounded-xl pl-3.5 pr-10 py-3 text-sm text-ink placeholder:text-steel/60 transition focus:bg-white focus:border-accent focus:ring-accent"
                id="user-password" name="password" placeholder="••••••••••••" required="" type="password" />
              <button aria-label="Alternar visibilidad de contraseña"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-steel hover:text-ink focus:outline-none"
                data-action="toggle-password" type="button">
                <span class="material-symbols-outlined text-lg" id="eye-icon">visibility</span>
              </button>
            </div>
          </div>

          <button
            class="w-full py-3 px-4 bg-ink hover:bg-accent text-white rounded-xl text-sm font-semibold transition shadow-sm flex items-center justify-center gap-2 mt-2"
            id="submit-btn" type="submit">
            <span>Iniciar Sesión</span>
            <span class="material-symbols-outlined text-base">arrow_forward</span>
          </button>
        </form>
      </div>

      <!-- Enlace alternativo -->
      <a class="mt-6 inline-flex items-center gap-2 text-xs font-semibold text-steel hover:text-ink transition-colors bg-white/70 px-3.5 py-2 rounded-lg border border-line"
        href="gestion-vinculacion.html">
        <span class="material-symbols-outlined text-base text-accent">admin_panel_settings</span>
        Acceso para Gestión y Vinculación
      </a>

    </div>
  </main>

  <footer
    class="w-full border-t border-line py-6 px-6 sm:px-12 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-steel bg-white">
    <div class="flex items-center gap-2">
      <span class="font-bold text-ink">TecNM</span>
      <span>© 2026 Tecnológico Nacional de México</span>
    </div>
    <div class="flex items-center gap-6 text-[11px] tracking-wide">
      <a class="hover:text-ink transition-colors" href="#reglamento">Reglamento</a>
      <a class="hover:text-ink transition-colors" href="#privacidad">Privacidad</a>
      <span class="font-mono">v2.4</span>
    </div>
  </footer>

  <script src="../assets/js/app.js?v=3" defer></script>
</body>

</html>
